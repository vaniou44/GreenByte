<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
<title>GreenByte</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
/* Single look on purpose: warm paper background with a dark green band, whatever the device theme. Layout concept: a calm, flat green-and-paper interface. One column on phones, a turn panel beside the hexagonal city on wide screens. */
:root{
  --bg:#F5EFE2; --surface:#FFFCF5; --surface2:#EDE5D2; --ink:#17301F; --muted:#485D4C; --line:#D9CFB8; --band:#C4E6A9; --band-ink:#17301F; --band-line:rgba(23,48,31,.5); --band-glass:rgba(23,48,31,.07); --pill:#17301F; --pill-ink:#FFFFFF; --logo-leaf:#006633; --edge:#17301F; --hexline:#17301F;
  --sh:0 1px 1px rgba(70,52,10,.10),0 10px 20px -12px rgba(70,52,10,.45); --sh-lift:0 2px 2px rgba(70,52,10,.12),0 16px 26px -12px rgba(70,52,10,.5);
  --btn:#1F6B3A; --btn-ink:#FFFFFF;
  --light:#B7E4A8; --mid:#4CAF6A; --dark:#1F6B3A; --bonus:#F2C14E; --malus:#F08A5D; --city:#CFE3EE; --blue:#2A7F9E;
  --red:#A93226; --red-ink:#FFFFFF; --good:#1F6B3A; --focus:#2A7F9E;
  --font-body:'Nunito','Segoe UI',system-ui,-apple-system,sans-serif;
  --font-head:'Fredoka','Nunito',system-ui,sans-serif;
}
:root[data-theme="dark"]{
  --bg:#1F3A2B; --surface:#2A4A38; --surface2:#335843; --ink:#EEF6EF; --muted:#BAD1BF; --line:#4A7359; --band:#16301F; --band-ink:#FFFFFF; --band-line:rgba(255,255,255,.55); --band-glass:rgba(255,255,255,.08); --pill:#B7E4A8; --pill-ink:#17301F; --logo-leaf:#4CAF6A; --edge:#0C1A12; --hexline:#7FA88B;
  --sh:0 1px 1px rgba(0,0,0,.4),0 10px 20px -12px rgba(0,0,0,.8); --sh-lift:0 2px 2px rgba(0,0,0,.5),0 16px 26px -12px rgba(0,0,0,.9);
  --btn:#B7E4A8; --btn-ink:#12261A; --red:#C0392B; --good:#8FD19E; --focus:#7CC4DE; --blue:#5BB3D0; --city:#35596A;
  color-scheme:dark;
}
*{box-sizing:border-box}
html{scrollbar-gutter:stable;overflow-x:clip}
body{overflow-x:clip;max-width:100vw}
body{background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:16px;line-height:1.5}
.band{background:var(--band);color:var(--band-ink);box-shadow:0 4px 14px -4px rgba(0,0,0,.35);position:relative;z-index:5}
.band-in{max-width:1040px;margin:0 auto;padding-block:14px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;align-items:center;justify-content:space-between;gap:12px}
.band-r{display:flex;align-items:center;gap:12px}
.theme{position:relative;display:inline-flex;padding:3px;border-radius:999px;border:1.5px solid var(--band-line);background:var(--band-glass)}
.theme::before{content:"";position:absolute;left:3px;top:3px;width:44px;height:38px;border-radius:999px;background:var(--pill);box-shadow:0 2px 0 rgba(0,0,0,.3);transform:translateX(0)}
:root[data-theme="dark"] .theme::before{transform:translateX(44px)}
.sndb{font:inherit;border:1.5px solid var(--band-line);background:var(--band-glass);color:var(--band-ink);width:47px;height:47px;border-radius:50%;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;margin-right:8px;padding:0}
.sndb svg{width:22px;height:22px}
.sndb:active svg{transform:scale(.85)}
.sndb:focus-visible{outline:3px solid #7CC4DE;outline-offset:2px}
.th{position:relative;font:inherit;border:0;background:transparent;color:var(--band-ink);width:44px;height:38px;border-radius:999px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center}
.th svg{width:20px;height:20px}
.th[aria-pressed="true"]{color:var(--pill-ink)}
@media (prefers-reduced-motion:no-preference){
.theme.ready::before{transition:transform .45s cubic-bezier(.34,1.56,.64,1)}
.th{transition:color .3s}
.th svg{transition:transform .5s cubic-bezier(.34,1.56,.64,1)}
.th[aria-pressed="true"] svg{transform:rotate(360deg) scale(1.1)}
.th[data-theme-set="dark"][aria-pressed="true"] svg{transform:rotate(-20deg) scale(1.1)}
.th:active svg{transform:scale(.8)}
body.themed,body.themed .panel,body.themed .pcard,body.themed .band,body.themed .opt,body.themed .inf,body.themed .mode,body.themed .seg label,body.themed .log li{transition:background-color .4s,border-color .4s,color .4s}
}
.th:focus-visible{outline:3px solid #7CC4DE;outline-offset:2px}
.band .btn.sec{color:var(--band-ink);border-color:var(--band-line)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--band);z-index:10}
.shell{max-width:1040px;margin:0 auto;padding-block:24px 40px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.brand{font-family:var(--font-head);font-weight:700;font-size:26px;letter-spacing:-0.01em;display:flex;align-items:center;gap:10px}
.brand{display:flex;align-items:center}
.logo-chip{display:block;line-height:0}.brand-btn{background:none;border:0;padding:0;cursor:pointer;border-radius:8px}.brand-btn:focus-visible{outline:3px solid var(--band-ink);outline-offset:3px}
.logo{height:56px;width:auto;display:block;margin:-4px 0}
.lg0{fill:var(--logo-leaf)}.lg1{fill:#F5F6D5}
h1,h2,h3{font-family:var(--font-head);margin:0;line-height:1.15;text-wrap:balance}
h1{font-size:clamp(34px,6vw,56px)} h2{font-size:26px} h3{font-size:19px}
h1:focus,h2:focus{outline:none}
p{margin:0;text-wrap:pretty}
.muted{color:var(--muted)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.stack{display:flex;flex-direction:column;gap:16px}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:18px 20px;min-width:0;box-shadow:var(--sh)}
.btn{font:inherit;font-weight:700;min-height:44px;padding:10px 18px;border-radius:10px;border:2px solid var(--btn);background:var(--btn);color:var(--btn-ink);cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px;text-align:center}
.btn.sec{background:transparent;color:var(--ink);border-color:var(--ink)}
.btn.sm{min-height:44px;min-width:44px;padding:6px 12px;font-size:15px}
.btn.big{font-size:19px;min-height:54px;padding:12px 26px}
.btn{box-shadow:0 3px 0 rgba(0,0,0,.3)}
#swarn{position:fixed;inset:0;z-index:9800;display:flex;align-items:center;justify-content:center;padding:16px;background:rgba(20,30,24,.55);-webkit-backdrop-filter:blur(5px);backdrop-filter:blur(5px)}
#swarn .swbox{max-width:440px;background:var(--surface);color:var(--ink);border:2px solid var(--ink);border-radius:20px;padding:24px;text-align:center;box-shadow:var(--sh-lift)}
#swarn .swbox{position:relative}
#swarn .swx{position:absolute;top:8px;right:8px;width:44px;height:44px;border:0;border-radius:50%;background:transparent;color:var(--ink);font-size:30px;line-height:1;cursor:pointer;display:flex;align-items:center;justify-content:center}
#swarn .swx:hover{background:rgba(0,0,0,.08)}
#swarn .swx:focus-visible{outline:3px solid var(--focus);outline-offset:1px}
#swarn .swbox p{margin:10px 0 18px;line-height:1.45}
@media (prefers-reduced-motion:no-preference){#swarn{animation:swfade .3s ease-out both}#swarn .swbox{animation:swpop .45s cubic-bezier(.2,.9,.3,1.2) both}#swarn.out{animation:swfade .22s ease-in reverse both}#swarn.out .swbox{animation:swpop .22s ease-in reverse both}}
@keyframes swfade{from{opacity:0}to{opacity:1}}
@keyframes swpop{from{opacity:0;transform:translateY(18px) scale(.92)}to{opacity:1;transform:none}}
#swarn .swico{width:44px;height:44px;margin:0 auto 8px;color:var(--ink)}#swarn .swico svg{width:100%;height:100%}
.btn.sec{box-shadow:none}
.btn:hover{filter:brightness(1.07)}
.btn:active{transform:translateY(2px);box-shadow:0 1px 0 rgba(0,0,0,.3)}
.btn.sec:active{transform:none}
.btn:focus-visible,.hexcell:focus-visible,input:focus-visible,select:focus-visible,.seg input:focus-visible+label{outline:3px solid var(--focus);outline-offset:2px}
.hero{display:flex;flex-direction:column;gap:14px;padding-block:8px 6px;max-width:680px}
.hero p{font-size:19px}
.modes{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(280px,100%),1fr));gap:16px;margin-top:22px}
.mode{font:inherit;color:inherit;text-align:left;background:var(--surface);border:2px solid var(--line);border-radius:16px;padding:22px;cursor:pointer;display:flex;flex-direction:column;gap:10px;min-height:44px}
.mode{box-shadow:var(--sh);transition:transform .15s,box-shadow .15s}
.mode:hover{border-color:var(--btn);transform:translateY(-3px);box-shadow:var(--sh-lift)}
.mode:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
.mode .tag{align-self:flex-start;font-size:12px;font-weight:700;letter-spacing:.1em;padding:5px 10px;border-radius:999px;color:#17301F}
.mode .tag.c-dark{color:#FFFFFF}
.fs{margin:0;min-width:0}
.gauge.dense .gc{font-size:11px;letter-spacing:-0.02em}
.hexcell.valid:focus-visible polygon{stroke:var(--focus);stroke-width:6}
.fs legend{font-weight:700;font-size:18px;padding:0;margin-bottom:10px;font-family:var(--font-head)}
.seg{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(240px,100%),1fr));gap:12px}
.seg.small{grid-template-columns:repeat(3,minmax(0,1fr));max-width:420px}
.seg input{position:absolute;opacity:0;width:1px;height:1px}
.seg label{box-shadow:0 2px 0 rgba(0,0,0,.1);display:flex;flex-direction:column;gap:2px;border:2px solid var(--line);border-radius:12px;padding:12px 14px;cursor:pointer;background:var(--surface);min-height:44px}
.seg label b{font-size:17px}
.seg label span{font-size:15px;color:var(--muted)}
.seg input:checked+label{border-color:var(--btn);box-shadow:inset 0 0 0 1px var(--btn);background:var(--surface2)}
.names{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(220px,100%),1fr));gap:12px}
.names label{display:flex;flex-direction:column;gap:4px;font-size:15px;font-weight:500}
input[type=text],select{font:inherit;min-height:44px;padding:8px 12px;border-radius:10px;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);width:100%}
.dot{display:inline-flex;align-items:center;justify-content:center;width:26px;height:26px;border-radius:50%;color:#FFFFFF;font-size:13px;font-weight:700;flex:none}
.chip{display:inline-block;font-size:13px;font-weight:700;letter-spacing:.06em;padding:4px 10px;border-radius:999px;color:#17301F}
.c-light{background:var(--light)} .c-medium{background:var(--mid)} .c-dark{background:var(--dark);color:#FFFFFF}
.c-bonus{background:var(--bonus)} .c-malus{background:var(--malus)} .c-disaster{background:var(--disaster);color:#FFFFFF} .c-city{background:var(--city);color:var(--ink)}
.status{display:flex;flex-direction:column;gap:12px}
.status-head{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;align-items:baseline}
.status-head b{font-family:var(--font-head);font-size:20px}
.gauge{display:grid;grid-template-columns:repeat(var(--n),minmax(0,1fr));gap:2px}
.gc{box-shadow:0 2px 0 rgba(0,0,0,.22),inset 0 1px 0 rgba(255,255,255,.4);height:34px;border-radius:5px;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;position:relative;color:#17301F}
.gc.ok{background:var(--mid)} .gc.warn{background:var(--bonus)} .gc.red{background:var(--red);color:var(--red-ink)}
.gc.now{outline:3px solid var(--ink);outline-offset:1px;z-index:1;font-size:13px}
.pbar{position:relative;height:12px;border-radius:6px;background:var(--surface2);border:1px solid var(--line);overflow:visible}
.pbar i{display:block;height:100%;background:var(--blue);border-radius:6px}
.pbar .tick{position:absolute;top:-4px;width:2px;height:18px;background:var(--ink)}
.pstrip{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(200px,100%),1fr));gap:12px}
.pcard{box-shadow:var(--sh);background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 16px;display:flex;flex-direction:column;gap:8px;min-width:0}
.pcard.now{border:2px solid var(--btn);padding:13px 15px}
.pname{display:flex;align-items:center;gap:8px;font-weight:700;min-width:0}
.pname span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:6px;font-size:15px}
.stats b{font-variant-numeric:tabular-nums}
.turnlay{display:grid;grid-template-columns:minmax(0,1fr);gap:16px}
@media (min-width:860px){.turnlay{grid-template-columns:minmax(0,4fr) minmax(0,6fr);align-items:start}}
.dice{display:inline-flex;gap:8px}
.dicegl{display:inline-block;position:relative;height:92px;vertical-align:top;pointer-events:none}
.dicegl.mini{height:10px;width:10px!important}
.dice3d{display:inline-flex;gap:30px;padding:20px 12px 16px}
.dwrap{position:relative;width:58px;height:58px}
.dtoss{display:none;width:58px;height:58px;perspective:650px}
.cube3d{display:block;position:relative;width:58px;height:58px;transform-style:preserve-3d;transform:rotateX(var(--fx)) rotateY(var(--fy))}
.cface,.dflat{position:absolute;inset:0;box-sizing:border-box;border:3px solid #17301F;border-radius:13px;background:#FFFCF5;display:grid;grid-template:repeat(3,1fr)/repeat(3,1fr);padding:7px}
.dflat{box-shadow:0 4px 0 #17301F}
.cface{border-radius:13px}
.f2,.f5{background:#F6EFDC}.f3,.f4{background:#EFE6CF}
.cface i,.dflat i{width:11px;height:11px;border-radius:50%;background:#17301F;place-self:center}
.cface.f1 i,.dflat.v1 i{background:#E0452F;width:16px;height:16px;box-shadow:inset 0 -2px 0 rgba(0,0,0,.18)}
.f1{transform:translateZ(27px)}.f6{transform:rotateY(180deg) translateZ(27px)}.f2{transform:rotateY(90deg) translateZ(27px)}.f5{transform:rotateY(-90deg) translateZ(27px)}.f3{transform:rotateX(90deg) translateZ(27px)}.f4{transform:rotateX(-90deg) translateZ(27px)}
.dshade{position:absolute;left:4px;right:4px;bottom:-14px;height:9px;border-radius:50%;background:rgba(0,0,0,.22);filter:blur(1.5px)}
@media (prefers-reduced-motion:no-preference){
@keyframes tumble{from{transform:rotateX(calc(var(--fx) + var(--sx))) rotateY(calc(var(--fy) + var(--sy))) rotateZ(var(--sz))}to{transform:rotateX(var(--fx)) rotateY(var(--fy)) rotateZ(0deg)}}
@keyframes toss{0%{transform:translateY(0)}26%{transform:translateY(-52px)}52%{transform:translateY(0)}68%{transform:translateY(-16px)}82%{transform:translateY(0)}91%{transform:translateY(-4px)}99.9%{transform:translateY(0);visibility:visible}100%{transform:translateY(0);visibility:hidden}}
@keyframes shade{0%{transform:scale(1);opacity:.9}26%{transform:scale(.55);opacity:.35}52%{transform:scale(1);opacity:.9}68%{transform:scale(.8);opacity:.6}82%{transform:scale(1);opacity:.9}100%{transform:scale(1);opacity:.9}}
@keyframes appear{to{visibility:visible}}
.rolling .dtoss{display:block;animation:toss 1.2s ease-in-out both}
.rolling .cube3d{animation:tumble 1.2s cubic-bezier(.2,.65,.25,1) both}
.rolling .dflat{visibility:hidden;animation:appear 0s 1.2s forwards}
.rolling .dshade{animation:shade 1.2s ease-in-out both}
}
.die{box-shadow:0 3px 0 rgba(0,0,0,.28);width:44px;height:44px;border-radius:10px;border:2px solid var(--ink);display:flex;align-items:center;justify-content:center;font-family:var(--font-head);font-weight:700;font-size:22px;background:var(--surface)}
.opts{display:flex;flex-direction:column;gap:10px}
.opt{box-shadow:0 2px 0 rgba(0,0,0,.12);font:inherit;text-align:left;min-height:48px;padding:10px 14px;border-radius:12px;border:2px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer}
.opt:hover{border-color:var(--btn)}
.opt:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
.opt.right{border-color:var(--good);background:var(--surface2)} .opt.wrong{border-color:var(--red)}
.card{box-shadow:var(--sh-lift);border-radius:14px;padding:16px 18px;display:flex;flex-direction:column;gap:8px;color:#17301F}
.card.bonus{background:var(--bonus)} .card.malus{background:var(--malus)} .card.disaster{background:var(--disaster);color:#FFFFFF}
.card h3{font-size:20px}
.banner{border-radius:12px;padding:14px 16px;font-weight:500}
.banner.lose{background:var(--red);color:var(--red-ink)} .banner.win{background:var(--surface2);border:1px solid var(--good)}
.banner.warn{background:var(--surface2);border:2px solid #F0B429;color:var(--ink);font-size:.95rem}
.note{font-size:15px;color:var(--muted)}
.infra{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(200px,100%),1fr));gap:10px}
.inf{box-shadow:0 2px 0 rgba(0,0,0,.12);font:inherit;text-align:left;border:2px solid var(--line);background:var(--surface);color:var(--ink);border-radius:12px;padding:10px 12px;cursor:pointer;display:flex;flex-direction:column;gap:2px;min-height:44px}
.inf:hover{border-color:var(--btn)} .inf:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
.inf.sel{border-color:var(--btn);box-shadow:inset 0 0 0 1px var(--btn);background:var(--surface2)}
.inf.poor{opacity:.6}
.inf small{color:var(--muted);font-size:14px}
svg.city{width:100%;height:auto;display:block;max-width:680px;margin:0 auto}
.hexcell{cursor:default}
.city .tile .glow,.city .tile .ring{pointer-events:none;opacity:0;transform-box:fill-box;transform-origin:50% 50%}
.city .tile .glow{fill:#FFD23F}
.city .tile .ring{fill:none;stroke:#FFD23F;stroke-width:5}
@media (prefers-reduced-motion:no-preference){
.city .tile.land{transform-box:fill-box;transform-origin:50% 100%;animation:tsq .75s cubic-bezier(.3,.7,.4,1) var(--ad,0s) both}
.city .tile.land .glow{animation:tglow .8s ease-out var(--ad,0s) both}
.city .tile.land .ring{animation:tring .85s ease-out var(--ad,0s) both}
}
@keyframes tsq{0%{transform:scale(1,1)}20%{transform:scale(1.07,.74)}55%{transform:scale(.985,1.07)}100%{transform:scale(1,1)}}
@keyframes tglow{0%{opacity:.85}100%{opacity:0}}
@keyframes tring{0%{opacity:1;transform:scale(1)}100%{opacity:0;transform:scale(1.75)}}
/* disaster animations */
#dfx{position:fixed;inset:0;z-index:9500;pointer-events:none;overflow:hidden;opacity:1;transition:opacity .6s}
#dfx.out{opacity:0}
#dfx i{position:absolute;display:block}
#dfx .main{position:absolute;inset:0;animation:dmainin .7s ease-out both}
@keyframes dmainin{from{opacity:0}to{opacity:1}}
#dfx .pre{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(150,10,10,.6);animation:dpre .5s ease-in-out infinite alternate;transition:opacity .7s}
#dfx .pre.gone{opacity:0}
@keyframes dpre{from{background:rgba(90,0,0,.6)}to{background:rgba(225,35,25,.82)}}
#dfx .pre .bar{position:absolute;left:0;right:0;height:60px;background:repeating-linear-gradient(-45deg,#FFD23F 0 24px,#1b1b1b 24px 48px);animation:dstripe .8s linear infinite}
#dfx .pre .bar.t{top:0}#dfx .pre .bar.b{bottom:0}
@keyframes dstripe{to{background-position:68px 0}}
#dfx .pre .box{position:relative;text-align:center;color:#fff;font-family:var(--font-head);animation:dpop2 .5s cubic-bezier(.2,1.5,.4,1) both;text-shadow:0 3px 0 rgba(0,0,0,.55),0 0 24px rgba(0,0,0,.6);padding:0 16px}
@keyframes dpop2{from{transform:scale(.3);opacity:0}to{transform:scale(1);opacity:1}}
#dfx .pre .box svg{display:block;width:clamp(64px,16vw,120px);margin:0 auto 10px;animation:dwarn .5s ease-in-out infinite alternate}
@keyframes dwarn{from{transform:scale(.92)}to{transform:scale(1.1)}}
#dfx .pre .box b{display:block;font-size:clamp(2rem,9vw,5.5rem);line-height:1;letter-spacing:.05em;text-transform:uppercase}
#dfx .pre .box small{display:block;margin-top:10px;font-size:clamp(.9rem,2.6vw,1.4rem);letter-spacing:.3em;text-transform:uppercase;font-weight:700}

/* result */
function result(){
  var ps=S.players;
  if(S.lost){return {lost:true};}
  var el=ps.map(function(p,i){return i;}).filter(function(i){return ps[i].perf>=WP();});
  if(!el.length){return {none:true};}
  el.sort(function(a,b){return ps[b].gp-ps[a].gp||ps[b].perf-ps[a].perf;});
  var t=el[0],w=el.filter(function(i){return ps[i].gp===ps[t].gp&&ps[i].perf===ps[t].perf;});
  return {winners:w};
}

function quickRules(){

  rtab('q1','Four things to track','<ul><li><b>Green Points:</b> your score. You earn them by answering questions and they never go down.</li><li><b>Eco-Coins:</b> your money. You win as many as Green Points and spend them to build.</li><li><b>Performance bar:</b> yours alone. It starts at 20%. You need 65% or more to win (50% in Express mode).</li><li><b>CO₂ gauge:</b> shared by everyone. If it reaches the red zone, everybody loses.</li></ul>')+

  return rtab('f1','The goal','<p>Your city needs digital infrastructure, but every server and data center adds CO₂. Answer questions to earn Eco-Coins, then build the infrastructure that raises your Performance without pushing the shared CO₂ gauge too high.</p><div class="rbox"><b>To win:</b> reach 65% Performance (50% in Express mode) and score the most Green Points, before the CO₂ gauge hits the red zone.</div><ul><li><b>Green Points:</b> your score. You earn them by answering questions, and they never go down.</li><li><b>Eco-Coins:</b> your spending money. You earn as many as Green Points, and you spend them to build.</li><li><b>Performance bar:</b> yours alone. It starts at 20%, and you need 65% or more to win (50% in Express mode).</li><li><b>CO₂ gauge:</b> shared by everyone. If it reaches the red zone, everybody loses (17 on the Easy gauge, 9 on the Hard gauge).</li></ul><p class="muted"><b>In the box:</b> a board with 2 sides (Easy and Hard), infrastructure tiles, 4 pawns, Eco-Coin tokens, 2 dice (the 2nd is for Express mode), Green Point markers, a Base and a Performance bar per player, question cards in 3 levels, bonus, malus and disaster cards, and a CO₂ marker. You also need a smartphone for the digital add-on.</p>')+

  rtab('f3','Your turn','<p>On your turn, do these three things in order.</p>'+rsteps(['<b>Roll and move.</b> Roll the die and move your pawn clockwise around the circuit. In Express mode, roll two dice and move by the total. Passing START does nothing.','<b>Resolve the tile you landed on.</b><br><b>Green tile.</b> The player on your left reads you a question of that level (in the app\'s automatic mode, the app asks). Right answer: take Green Points, and the same number of Eco-Coins. Wrong answer: you get nothing, and the CO₂ marker goes up by 1.<br><b>Bonus (+) or malus (−) tile.</b> Draw a card and do what it says.<br><b>Disaster tile (Hard side only).</b> Draw a disaster card. It ruins one of your own infrastructures, of the type named on the card. If you have none of that type, nothing is ruined and the CO₂ marker goes up by 1.','<b>Build or repair (only after a right answer).</b> Spend your Eco-Coins on one infrastructure, or repair a ruined one. Eco-Coins won from a Bonus card can wait for a later turn.'])+rtable(['Tile','Question','Green Points','Eco-Coins'],[['Light green','Easy',1,1],['Medium green','Intermediate',2,2],['Dark green','Hard',3,3]])+'<p><b>Disaster at the end of the round (Easy board).</b> When every player has played, one disaster card hits one player, drawn at random (roll a die if you play on the real board). They ruin one of their infrastructures of the type named on the card, or lose 1 Eco-Coin. If they have none of that type, they are spared. In the app\'s Automatic and Full game modes, the app draws it for you.</p><p><b>End of your turn.</b> Pass the die (or dice) to the player on your left. When every player has played once, the round is over (on the Easy board, the round disaster strikes first).</p>')+
  rtab('f4','Cards','<p>Three decks, one for each kind of tile.</p><ul><li><b>Question cards (green tiles).</b> The player on your left reads the question. A right answer earns points and Eco-Coins.</li><li><b>Bonus and malus cards (+ and − tiles).</b> Most cards work right away. Read the card aloud, do what it says, then discard it. Cards marked <b>SAVE</b> can be kept: keep it face up in front of you and play it later, only during your own turn. If it targets another player, that player must follow it. <i>Team training</i> is a SAVE card: your next build costs 1 Eco-Coin less.</li><li><b>Disaster cards (! tiles, Hard side only).</b> Read the card aloud. It names a type of infrastructure, and it ruins one of your own infrastructures of that type. If you have several, you choose which one. If you have none of that type, nothing is ruined, and the CO₂ marker goes up by 1.</li></ul><p>Eco-Coins can never drop below 0. Coins won from a Bonus card don\'t let you build this turn: you can only build after a right answer.</p><div class="rbox"><b>A ruined infrastructure.</b> Flip the tile over. It stays on its space, and nobody can build there. Its effects stop: lower its owner\'s Performance by the tile\'s bonus, and if it was green, the CO₂ marker goes back up by the tile\'s CO₂ value. You can repair it on a later turn instead of building, and its effects count again.</div><p><b>Example.</b> Leo lands on a disaster tile. The card says: Solar panels are ruined. He owns two, so he chooses one and flips it. His Performance goes down by 4%, and the CO₂ marker goes up by 1.</p>')+
  rtab('f5','Build your city','<p>After a right answer, you may build, or repair a ruined infrastructure.</p>'+R_INFRA()+'<ul><li><b>Pay.</b> Spend the cost in Eco-Coins. If you can\'t afford it, you keep your coins and skip the build.</li><li><b>Stay connected.</b> Put the tile on an empty city space that touches your Base or one of your own infrastructures. A ruined infrastructure still counts as connected and keeps its space.</li><li><b>Apply the effects.</b> Move your Performance bar and the CO₂ marker right away. Performance can\'t go above 100%.</li><li><b>One build per turn.</b></li><li><b>Repair.</b> Instead of building, flip one of your ruined infrastructures back over. It is free, and it replaces your build for this turn. Your Performance goes back up, and a green one brings the CO₂ marker back down by its CO₂ value.</li></ul><p><b>Example.</b> Mia answers a medium question right: +2 Green Points, +2 Eco-Coins. She spends 2 on solar panels next to her Base. The CO₂ marker goes down by 1, and her Performance goes from 20% to 24%.</p>')+
  rtab('f6','End of a round','<p>A round ends when every player has played once. Then follow these two steps in order.</p>'+rsteps(['<b>The CO₂ rises.</b> Move the CO₂ marker up by 1.','<b>Check the end of the game.</b> Check the end condition of your mode. If the game is not over, start a new round.'])+'<div class="rbox red"><b>Red zone.</b> The moment the CO₂ marker reaches the red zone (17 on the Easy gauge, 9 on the Hard gauge), the game stops immediately and everybody loses. This is true at any time: after a wrong answer, a card, a build or a disaster, even in the middle of a turn.</div>'+rtable(['Gauge','Range','Start','Safe','Warning','Red zone'],[['Easy','0 to 20',8,'0 to 10','11 to 16','17 to 20'],['Hard','0 to 10',4,'0 to 5','6 to 8','9 and 10']]))+
  rtab('f7','How to win','<p>Pick a board (Easy or Hard) and a length (Normal or Express).</p><ul><li><b>Normal mode, the city is full.</b> The game ends immediately, as soon as the last empty space of the city is filled, even in the middle of a round. A ruined infrastructure still fills its space. You roll one die.</li><li><b>Express mode, 10 rounds.</b> The game ends after round 10, even if the city is not full. Same rules, but you roll two dice instead of one, and you only need 50% Performance to win.</li></ul><p>On both boards, everybody loses as soon as the CO₂ marker reaches the red zone, at any moment of the game.</p><h4>Who wins?</h4>'+rsteps(['The CO₂ marker must still be out of the red zone.','Only players with a Performance bar at 65% or more (50% in Express mode) can win. If nobody reaches that level, everybody loses.','Among those players, the one with the most Green Points wins. Eco-Coins you spent don\'t matter: Green Points never go down.'])+'<p><b>Tie.</b> The player with the higher Performance bar wins. If it is still tied, the tied players share the victory.</p><div class="rbox"><b>Tip.</b> Servers and data centers raise your Performance fast, but they push the CO₂ up. Green infrastructure keeps the gauge low for everyone. On the Hard side, a disaster tile can ruin one of your infrastructures, so don\'t count on a single big build.</div>');
}

  var co2ctl='<div class="ctl"><span>Adjust the gauge</span><span class="v"><button class="btn sec sm" data-a="m-co2" data-d="-1" aria-label="CO₂ minus 1">−</button><output aria-live="polite">'+S.co2+'</output><button class="btn sec sm" data-a="m-co2" data-d="1" aria-label="CO₂ plus 1">+</button></span></div>'+

    '<p class="note">At the end of a round, add 1 to the CO₂ gauge. If a player lands on a disaster tile (Hard board only), lower the Performance of that player by the bonus of the ruined infrastructure, and add 1 to the CO₂ gauge if it was green.</p>';
  var cards=S.players.map(function(p,i){

    var opts=Object.keys(INFRA).map(function(k){return '<option value="'+k+'">'+INFRA[k].name+' ('+INFRA[k].cost+' Eco-Coins)</option>';}).join('');
    return '<section class="pcard" style="padding:16px" aria-label="'+esc(p.name)+'"><div class="pname"><span class="dot" style="background:'+p.color+'" aria-hidden="true">'+initial(p)+'</span><span>'+esc(p.name)+'</span></div>'+
      ctl('Green Points',p.gp,'m-gp',1)+ctl('Eco-Coins',p.ec,'m-ec',1)+ctl('Performance',p.perf,'m-perf',5,'%')+pbarHtml(p.perf)+
      '<div><div class="note" style="margin-bottom:6px">Right answer</div><div class="quick"><button class="btn sm c-light" style="border-color:transparent;color:#17301F" data-a="m-right" data-i="'+i+'" data-lv="light">Light +1</button><button class="btn sm c-medium" style="border-color:transparent;color:#17301F" data-a="m-right" data-i="'+i+'" data-lv="medium">Medium +2</button><button class="btn sm c-dark" style="border-color:transparent;color:#FFFFFF" data-a="m-right" data-i="'+i+'" data-lv="dark">Dark +3</button><button class="btn sec sm" data-a="m-wrong">Wrong: CO₂ +1</button></div></div>'+
      '<div><label class="note" for="b'+i+'" style="display:block;margin-bottom:6px">Build an infrastructure</label><div class="quick"><select id="b'+i+'" style="flex:1;min-width:150px">'+opts+'</select><button class="btn sm" data-a="m-build" data-i="'+i+'">Build</button></div></div></section>';
  }).join('');

var GQ={
 idle:['Take your time. The planet can wait... a little.','Think green!','No pressure. Okay, a little pressure.','Trust your inner eco-nerd.'],
 right:['Nailed it!','Big brain energy!','Green genius!','Chef\'s kiss.','Look at you, saving the planet!'],
 wrong:['Oops!','Ouch, not quite!','Plot twist: that was not it.','Don\'t worry, even servers crash.','Oh nooo... so close. Well, not really.'],
 malus:['Oops!','Oh nooo...','How unfortunate.','Well, that escalated quickly.','That is going to hurt the CO₂ gauge.','Even my leaf wilted a little.'],
 bonus:['Ooh, nice one!','Now we are talking!','Eco-hero move!','The planet says thank you!'],

};
function gqPick(list,seed){var h=0,i;seed=String(seed);for(i=0;i<seed.length;i++){h=(h*31+seed.charCodeAt(i))>>>0;}return list[h%list.length];}
function gmBox(text,sad,happy){
  return '<div class="gm'+(sad?' sad':'')+'" data-mood="'+(sad?'sad':(happy?'happy':'idle'))+'"><div class="gmc" aria-hidden="true">'+MAS_SVG+'</div><div class="gmb" role="status"><p class="mname">Byte</p><p class="gmt">'+text+'</p></div></div>';
}
function gmHtml(){
  var ph=S.phase,sd=S.round+':'+S.cur+':'+(S.tile||'')+':'+(S.card?S.card.t:'')+':'+(S.q?S.q.id:'');
  if(ph==='question'){return gmBox(esc(gqPick(GQ.idle,sd)),false);}
  if(ph==='feedback'){
    if(S.ans&&S.ans.ok){return gmBox('<b>'+esc(gqPick(GQ.right,sd))+'</b>',false,true);}
    return gmBox('<b>'+esc(gqPick(GQ.wrong,sd))+'</b> '+esc(S.q.why),true);
  }
  if(ph==='dpick'||ph==='event'){return gmBox('<b>'+esc(gqPick(GQ.dis,sd))+'</b>',true);}
  if(ph==='card'&&S.card){
    if(S.card.kk==='disaster'){return gmBox('<b>'+esc(gqPick(GQ.dis,sd))+'</b>',true);}
    if(S.card.k==='malus'){return gmBox('<b>'+esc(gqPick(GQ.malus,sd))+'</b>',true);}
    if(S.card.k==='bonus'){return gmBox('<b>'+esc(gqPick(GQ.bonus,sd))+'</b>',false,true);}
  }
  return '';
}

        rc.close=function(){rc.open=false;clearInterval(hb);clearInterval(wd);try{c.end(true);}catch(e){}};
        if(!cb.first(rc)){rc.close();return;}
        hb=setInterval(function(){rc.send({t:'ping'});},6000);

      c.subscribe(base+'/g/'+cid,{qos:1},function(e2){
        if(e2){try{c.end(true);}catch(x){}next();return;}
        try{c.publish(base+'/h',JSON.stringify({c:cid,m:{t:'hello',cid:cid,name:nm}}),{qos:1});}catch(x){}
        wait=setTimeout(function(){if(!got){try{c.end(true);}catch(x){}rg.client=null;next();}},4500);

function netHost(){

  try{localStorage.setItem('gb-name',nm);}catch(e){}
  netClose();NET.busy=true;NET.msg='';render();
  var tries=0;
  function become(code){
    NET.role='host';NET.code=code;NET.seat=0;NET.busy=false;NET.msg='';
    NET.pl=[{cid:netCid(),name:nm,conn:null,on:true}];

  }
  (function open(){
    var code=randCode(),p,done=false,to;

      NET.peer=null;

      NET.code=code;
      relayHostStart(code,function(ok){

      if(done){return;}
      if(e&&e.type==='unavailable-id'&&tries++<5){done=true;clearTimeout(to);try{p.destroy();}catch(x){}open();return;}
      viaRelayOnly();
    });
  })();
}

    else if(NET.pl.length>=4){conn.send({t:'err',msg:'This room is full (4 players).'});return;}

function netConnect(code,nm,silent){
  var p=null,done=false,locked=null,rg=null,rt=null,to,c=null,p2pDead=false,relayDead=false,canRelay=rOk(),preferRelay=canRelay&&NET.via==='relay';
  NET.role='guest';
  function bad(msg){
    if(done){return;}done=true;clearTimeout(to);clearTimeout(rt);
    if(rg){rg.stop=true;try{if(rg.client){rg.client.end(true);}}catch(e){}rg=null;}
    if(silent){netRetry(code,nm);}else{netFail(msg);}
  }
  function lock(kind){locked=kind;done=true;clearTimeout(to);clearTimeout(rt);}
  function lostLink(link){
    if(NET.role!=='guest'||NET.conn!==link){return;}
    if(S&&S.online&&screen!=='end'||screen==='lobby'){NET.lost=true;render();netRetry(code,nm);}
    else{netFail('Connection to the room was lost.');}
  }
  var MSG='Cannot reach the room. Check the code, and ask the host to keep the page open.';
  function startRelay(){
    if(locked||rg||!canRelay||done){return;}
    rg=relayGuest(code,nm,{
      first:function(rcn){
        if(locked){return false;}
        lock('relay');NET.via='relay';NET.conn=rcn;
        if(p){var pp=p;p=null;NET.peer=null;setTimeout(function(){try{pp.destroy();}catch(e){}},50);}
        rcn.send({t:'via',cid:netCid()});
        return true;
      },
      data:function(m){guestMsg(m);},
      close:function(rcn){lostLink(rcn);},
      fail:function(){relayDead=true;rg=null;if(p2pDead||!p){bad(MSG);}}
    });
  }
  to=setTimeout(function(){bad(MSG);},canRelay?28000:11000);
  if(preferRelay){startRelay();return;}
  if(typeof Peer==='undefined'){if(canRelay){startRelay();}else{bad('The online library could not load.');}return;}
  try{p=new Peer(netOpts());}catch(e){p=null;if(canRelay){startRelay();}else{bad('Could not start the online service.');}return;}
  NET.peer=p;
  if(canRelay){rt=setTimeout(startRelay,4500);}
  p.on('error',function(e){
    if(locked){return;}
    p2pDead=true;
    if(canRelay){startRelay();if(relayDead){bad(netErr(e));}}
    else{bad(netErr(e));}
  });
  p.on('open',function(){
    c=p.connect('gbyte-'+code,{reliable:true});NET.conn=c;
    c.on('open',function(){c.send({t:'hello',cid:netCid(),name:nm});});
    c.on('data',function(m){
      if(locked==='relay'){return;}
      if(!locked){
        lock('p2p');NET.via='p2p';
        if(rg){rg.stop=true;try{if(rg.client){rg.client.end(true);}}catch(e){}rg=null;}
        try{c.send({t:'via',cid:netCid()});}catch(e){}
      }
      guestMsg(m);
    });
    c.on('close',function(){
      if(locked==='relay'){return;}
      if(!locked){p2pDead=true;if(canRelay){startRelay();}return;}
      if(NET.role!=='guest'||NET.peer!==p){return;}
      lostLink(c);
    });
  });
}
function netRetry(code,nm){
  if(NET.retry){return;}
  NET.tries=(NET.tries||0)+1;if(NET.tries===3){NET.via=null;}if(NET.tries>12){netFail('Could not reconnect to the room.');return;}
  NET.retry=setTimeout(function(){
    NET.retry=null;
    if(NET.role!=='guest'&&!NET.lost){return;}
    try{if(NET.peer){NET.peer.destroy();}}catch(e){}
    netConnect(code,nm,true);
  },2500);
}
function guestMsg(m){
  if(!m||typeof m!=='object'){return;}
  if(m.t==='hping'){return;}
  if(m.t==='err'){netFail(m.msg||'Could not join.');return;}
  if(m.t==='closed'){try{sessionStorage.removeItem('gb-room');}catch(e){}netClose();F.online=false;S=null;NET.msg='The host closed the room.';screen='online';render();return;}
  if(m.t==='chat'&&m.m){chatAdd({n:m.m.n|0,name:String(m.m.name||''),txt:String(m.m.txt||''),id:m.m.id});return;}
  if(m.t==='chathist'&&m.list){NET.chat=m.list.slice(-60).map(function(x){return {n:x.n|0,name:String(x.name||''),txt:String(x.txt||''),id:x.id};});chatDraw();return;}
  NET.busy=false;NET.lost=false;NET.tries=0;
  try{sessionStorage.setItem('gb-room',NET.code);}catch(e){}
  if(m.t==='lobby'){
    NET.lobby=m;NET.code=m.code||NET.code;F.board=m.board;F.length=m.length;
    var me=-1;m.players.forEach(function(p,i){if(p.cid===netCid()){me=i;}});
    if(me>=0){NET.seat=me;}
    if(screen!=='lobby'){F.online=true;screen='lobby';}
    render();
  }else if(m.t==='state'){
    var old=S;
    NET.seat=m.seat;NET.off=m.off||[];NET.code=m.code||NET.code;F.online=true;
    if(old&&old.dice&&m.S.dice&&JSON.stringify(old.dice)===JSON.stringify(m.S.dice)){m.S.dice=old.dice;}
    S=m.S;
    if(m.screen!==screen){
      NET.want=m.screen;
      if(!NET.sw){NET.sw=true;splash(function(){NET.sw=false;screen=NET.want;render();});}
      else{render();}
    }else{render();}
  }
}

function dd(s){return s.replace(/(.)\1+/g,'$1');}
function sk(s){return dd(s.replace(/ph/g,'f').replace(/[cq]/g,'k').replace(/z/g,'s').replace(/w/g,'u').replace(/y/g,'i'));}
function norm1(w){
  var s=String(w).toLowerCase(),o='',i,c;
  try{s=s.normalize('NFKD').replace(/[̀-ͯ]/g,'');}catch(e){}
  for(i=0;i<s.length;i++){c=s.charAt(i);o+=HOMO[c]||c;}
  var m={'@':'a','4':'a','3':'e','€':'e','1':'i','!':'i','|':'i','0':'o','5':'s','$':'s','7':'t','+':'t','8':'b','9':'g','6':'g','¡':'i'};
  return o.replace(/[@4$€13!|¡05+78 96]/g,function(c){return m[c]||'';}).replace(/[^a-z]/g,'');
}
var K_SUB=W_SUB.filter(Boolean).map(function(x){return sk(dd(x));}).filter(function(x){return x.length>=3;}),K_PRE=W_PRE.filter(Boolean).map(function(x){return sk(dd(x));}).filter(function(x){return x.length>=3;}),SET_EX={};
W_EX.forEach(function(x){SET_EX[dd(x)]=1;});
function lev1(a,b){
  if(Math.abs(a.length-b.length)>1){return false;}
  var i=0,j=0,e=0;
  while(i<a.length&&j<b.length){
    if(a.charAt(i)===b.charAt(j)){i++;j++;continue;}
    if(++e>1){return false;}
    if(a.length>b.length){i++;}else if(a.length<b.length){j++;}else{i++;j++;}
  }
  return e+(a.length-i)+(b.length-j)<=1;
}
function hit(v){
  if(!v){return false;}
  var t=dd(v);if(W_SAFE[t]===1||W_SAFE[v]===1){return false;}
  if(SET_EX[t]){return true;}
  var k=sk(t),i,p;
  for(i=0;i<K_SUB.length;i++){p=K_SUB[i];
    if(k.indexOf(p)>=0&&p.length>=3){return true;}
    if(p.length>=6&&k.length>=p.length&&k.length<=p.length+1&&lev1(k,p)){return true;}
    if(p.length>=8&&k.length===p.length-1&&lev1(k,p)){return true;}
  }
  for(i=0;i<K_PRE.length;i++){p=K_PRE[i];
    if(k===p||(k.indexOf(p)===0&&k.length<=p.length+2)){return true;}
    if(p==='shiti'||p==='shit'){if(k.slice(-p.length)===p){return true;}}
  }
  return false;
}
function badWord(w){
  var w2=String(w),a=norm1(w2);if(W_SAFE[a]===1&&!/[*#?]/.test(w2)){return false;}var vs=[norm1(w2.replace(/0/g,'u')),a,a.replace(/v/g,'u'),a.replace(/w/g,'u'),a.replace(/i/g,'l'),a.replace(/v/g,'u').replace(/w/g,'u')],i;
  if(w2.indexOf('*')>=0||w2.indexOf('#')>=0||w2.indexOf('?')>=0){
    var base=w2.toLowerCase(),vv='aeiouy'.split('');
    for(i=0;i<vv.length;i++){var r=norm1(base.replace(/[*#?]/g,vv[i]));if(hit(r)||hit(r.replace(/v/g,'u'))){return true;}}
    if(hit(norm1(base.replace(/[*#?]/g,'')))){return true;}
  }
  for(i=0;i<vs.length;i++){if(hit(vs[i])){return true;}}
  return false;
}
function stars(w){return new Array(w.length+1).join('*');}
function censor(txt){
  var src=String(txt||''),out=src,changed=false;
  function mark(f){var o2=f(out);if(o2!==out){changed=true;}out=o2;}
  /* words in other alphabets */
  mark(function(o){return o.replace(/[^\s]+/g,function(tok){var l=tok.toLowerCase(),j;for(j=0;j<W_NATIVE.length;j++){if(l.indexOf(W_NATIVE[j])>=0){return stars(tok);}}return tok;});});
  /* letters spread out: "f u c k", "f.u.c.k" */
  mark(function(o){return o.replace(/(^|[^A-Za-z0-9])((?:[A-Za-z0-9][\s.\-_*]+){2,}[A-Za-z0-9])(?![A-Za-z0-9])/g,function(all,pre,run){
    return badWord(run.replace(/[^A-Za-z0-9]/g,''))?pre+stars(run):all;});});
  /* words with dots or dashes inside: "p.u.t.e", "fu-ck" */
  mark(function(o){return o.replace(/[A-Za-z0-9]+(?:[.\-_][A-Za-z0-9]+)+/g,function(w){return badWord(w.replace(/[.\-_]/g,''))?stars(w):w;});});
  /* a word cut in pieces by spaces: "pu te", "fu ck" */
  mark(function(o){var parts=o.split(/(\s+)/),i,j,n=parts.length;
    for(i=0;i<n;i+=2){
      if(!/^[A-Za-z0-9@$!+]{1,4}$/.test(parts[i])||badWord(parts[i])){continue;}
      var j2=i,joined=parts[i],hitEnd=-1;
      for(j=i+2;j<n&&j<=i+6;j+=2){
        if(!/^[A-Za-z0-9@$!+]{1,4}$/.test(parts[j])||/^\s*\n/.test(parts[j-1])||badWord(parts[j])){break;}
        joined+=parts[j];
        if(joined.length>=4&&badWord(joined)){hitEnd=j;break;}
      }
      if(hitEnd>0){for(j=i;j<=hitEnd;j+=2){parts[j]=stars(parts[j]);}i=hitEnd;}
    }
    return parts.join('');});
  /* normal words, with look-alike symbols */
  mark(function(o){return o.replace(/[A-Za-z0-9@$!+*#?|À-ɏͰ-ϿЀ-ӿ]+/g,function(w){
    var tr=(/[!?+$#*|]+$/.exec(w)||[''])[0],c=w.slice(0,w.length-tr.length);
    if(/^\*+$/.test(w)){return w;}
    return (c&&badWord(c))?stars(c)+tr:(badWord(w)?stars(w):w);});});
  /* the same word cut by spaces or symbols inside a long word: check the whole message without separators */
  if(!changed){
    var flat=norm1(src.replace(/[\s.\-_*]+/g,'')),f2=flat.replace(/v/g,'u'),i;
    for(i=0;i<K_SUB.length;i++){var p=K_SUB[i];
      if(p.length>=6){var a=sk(dd(flat)),b=sk(dd(f2));if(a.indexOf(p)>=0||b.indexOf(p)>=0){return stars(src);}}}
  }
  return out;
}

function act(a,d,rs){

  if(a==='net-start'){netStart();return;}
  if(a==='net-copy'){netCopy();return;}

    if(a==='end-turn'&&(S.lost||S.full)){}
    else if(S.cur!==seat||TURNACT[a].indexOf(S.phase)<0){return;}
  }
  if(S&&S.online&&a==='next-round'&&S.phase!=='round'){return;}
  if(S&&S.online&&a==='again'&&NET.role!=='host'){return;}
  if(a==='skip'){if(NET.role==='host'&&S&&S.online){stopMove();S.sel=null;if(S.phase==='round'){nextRound();}else if(S.phase==='event'){advanceTurn();}else{endTurn();}}return;}
  if(a==='home'||a==='landing'||a==='enter'||a==='mode'||a==='start'||a==='again'){stopMove();}
  if(a==='landing'){logoLiquid(function(){screen='landing';render();},true);return;}
  if(a==='enter'){logoLiquid(function(){var j=NET.joinLink;screen=j?'online':'home';NET.joinLink=false;render();if(!j){mascotStart();}},false);return;}
  if(a==='rules'){rulesTab=d.t==='full'?'full':'quick';splash(function(){screen='rules';render();window.scrollTo(0,0);});return;}
  if(a==='rtab'){rulesTab=d.t;render();window.scrollTo(0,0);return;}
  if(a==='rjump'){var el=document.getElementById(d.t);if(el){el.scrollIntoView({behavior:'smooth',block:'start'});}return;}
  if(a==='home'){splash(function(){screen='home';render();});return;}
  if(a==='mode'){F.online=false;if(d.m==='online'){NET.msg='';splash(function(){screen='online';render();});return;}F.mode=d.m;splash(function(){screen='setup';render();});return;}
  if(a==='start'){soundWarn(function(){splash(function(){newGame();screen='game';render();say('Game started');});});return;}
  if(a==='again'){splash(function(){newGame();screen='game';render();});return;}
  if(!S){return;}
  var i=+d.i;
  if(a==='m-gp'){mut(function(){var p=S.players[i];p.gp=Math.max(0,p.gp+ +d.d);});}
  else if(a==='m-ec'){mut(function(){var p=S.players[i];p.ec=Math.max(0,p.ec+ +d.d);});}
  else if(a==='m-perf'){mut(function(){var p=S.players[i];p.perf=clamp(p.perf+ +d.d,0,100);});}
  else if(a==='m-co2'){mut(function(){addCo2(+d.d);log('CO₂ adjusted by '+sgn(+d.d)+'.');});}
  else if(a==='m-right'){mut(function(){var p=S.players[i],pts=LV[d.lv].pts;p.gp+=pts;p.ec+=pts;log(esc(p.name)+': right answer, +'+pts+'.');});}
  else if(a==='m-wrong'){mut(function(){addCo2(1);log('Wrong answer: CO₂ +1.');});}
  else if(a==='m-build'){
    var sel=document.getElementById('b'+i),k=sel&&sel.value,p0=S.players[i];
    if(!INFRA[k]){return;}
    if(p0.ec<INFRA[k].cost){S.msg=esc(p0.name)+' needs '+INFRA[k].cost+' Eco-Coins for a '+INFRA[k].name.toLowerCase()+'.';render();return;}
    mut(function(){var p=S.players[i],f=INFRA[k];p.ec-=f.cost;p.perf=Math.min(100,p.perf+f.perf);addCo2(f.co2);log(esc(p.name)+' built a '+f.name.toLowerCase()+'.');});
  }
  else if(a==='m-round'){mut(function(){addCo2(1);S.round++;log('Round '+(S.round-1)+' ended: CO₂ +1.');});}
  else if(a==='m-undo'){
    if(!S.hist.length){return;}
    var o=JSON.parse(S.hist.pop());S.players=o.players;S.co2=o.co2;S.round=o.round;S.lost=o.lost;S.msg='';render();

  else if(a==='tile'){S.dice=null;S.msg='';S.tile=d.t;land();}
  else if(a==='answer'){doAnswer(+d.idx);render();}
  else if(a==='to-build'){S.phase='build';S.sel=null;S.msg='';render();}

  else if(a==='play'){playCard(+d.idx,+d.i);}
